# 服务器端（阿里云 ECS）编排：只拉取 GitHub Actions 构建并推送到 GHCR 的不可变镜像，
# 服务器上不构建。本地开发请用 deploy/compose.yaml，两者互不影响。
#
# 数据库复用 ECS 上已有的 MySQL 实例（容器名 mysql，网络 mysql_default）：
#   - 本编排不创建数据库容器，避免与既有实例争抢 1.6G 内存
#   - research 库与 research 账号独立，不读写既有其他库
#   - 只有 web 发布端口；api/worker/web 都只在共享容器网络内，数据库不额外暴露
#   - 容器不执行迁移（见 docs/runbook.md“进程生命周期”），迁移由 deploy.sh 在启动前单独执行

name: research-platform-server

x-api-env: &api-env
  RP_ENVIRONMENT: ${RP_ENVIRONMENT:-development}
  RP_LOG_LEVEL: ${RP_LOG_LEVEL:-INFO}
  # 应用库：SQLite，落在 sqlite-data 卷，与本地开发同构。
  # 必须与研究源分开——config.py 对“应用库与源库同地址”直接拒绝启动。
  RP_DATABASE_URL: ${RP_DATABASE_URL:-sqlite:////app/data/app.db}
  RP_AUTH__SECRET: ${RP_AUTH__SECRET:?deploy/.env 须提供 RP_AUTH__SECRET}
  # 纯 HTTP 访问时必须为 false，否则浏览器不回传会话 cookie，登录必然失败。
  RP_AUTH__COOKIE_SECURE: ${RP_AUTH__COOKIE_SECURE:-false}
  RP_AUTH__REGISTRATION: ${RP_AUTH__REGISTRATION:-invite}
  RP_AUTH__SESSION_TTL_HOURS: ${RP_AUTH__SESSION_TTL_HOURS:-168}
  RP_UPSTREAM__ENABLED: ${RP_UPSTREAM__ENABLED:-true}
  RP_TUSHARE__TOKEN: ${RP_TUSHARE__TOKEN:-}
  RP_SOURCE_MYSQL__HOST: ${RP_SOURCE_MYSQL_HOST:-}
  RP_SOURCE_MYSQL__PORT: ${RP_SOURCE_MYSQL_PORT:-}
  RP_SOURCE_MYSQL__DATABASE: ${RP_SOURCE_MYSQL_DATABASE:-}
  RP_SOURCE_MYSQL__USERNAME: ${RP_SOURCE_MYSQL_USERNAME:-}
  RP_SOURCE_MYSQL__PASSWORD: ${RP_SOURCE_MYSQL_PASSWORD:-}
  RP_SOURCE_MYSQL__TLS: ${RP_SOURCE_MYSQL_TLS:-}
  RP_SOURCE_MYSQL__CA_FILE: ${RP_SOURCE_MYSQL_CA_FILE:-}
  # 自签 CA 必须由运维挂载进容器，路径与上面的 CA_FILE 一致，例如给 api 与
  # worker 各加一行：volumes: ["/etc/research/source-ca.pem:/certs/source-ca.pem:ro"]
  # 配置了 CA_FILE 却未挂载文件时启动即失败，不会静默降级为不校验连接。
  RP_REVIEW__CACHE_SECONDS: ${RP_REVIEW_CACHE_SECONDS:-60}
  RP_REVIEW__MAX_WINDOW: ${RP_REVIEW_MAX_WINDOW:-120}
  RP_REVIEW__MAX_RANGE_DAYS: ${RP_REVIEW_MAX_RANGE_DAYS:-366}
  RP_REVIEW__LOOKBACK_DAYS: ${RP_REVIEW_LOOKBACK_DAYS:-400}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${RP_IMAGE_API:?由 deploy/deploy.sh 注入镜像地址}
    restart: unless-stopped
    environment:
      <<: *api-env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    stop_grace_period: 20s
    logging: *default-logging
    volumes:
      - sqlite-data:/app/data
    networks: [shared]

  worker:
    image: ${RP_IMAGE_API:?由 deploy/deploy.sh 注入镜像地址}
    restart: unless-stopped
    command: [python, -m, research_platform.modules.execution.worker]
    environment:
      <<: *api-env
    stop_grace_period: 40s
    logging: *default-logging
    volumes:
      - sqlite-data:/app/data
    networks: [shared]

  web:
    image: ${RP_IMAGE_WEB:?由 deploy/deploy.sh 注入镜像地址}
    restart: unless-stopped
    ports:
      - "${RP_WEB_PORT:-80}:8080"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks: [shared]

volumes:
  sqlite-data:

networks:
  shared:
    external: true
    name: ${MYSQL_NETWORK:-mysql_default}
