server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }
  location /health/ {
    proxy_pass http://api:8000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
