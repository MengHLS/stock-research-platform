name: deploy-dev

# dev 分支的自动部署：质量门禁 → 构建不可变镜像推送 GHCR → SSH 到 ECS 拉取并滚动启动。
# 该服务器实测 Docker Hub 不可达、GHCR 可访问，所以镜像在 Actions 构建，服务器只拉取。
# 生产分支不经过本工作流；生产发布门槛见 docs/runbook.md。

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 同一分支串行部署，避免两次发布交叉启动容器；不取消进行中的部署，防止半途状态。
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装固定版本工具
        run: |
          python -m pip install uv==0.12.3
          npm install --global pnpm@11.24.0
      - name: 安装锁定依赖
        run: |
          uv sync --locked
          pnpm --dir frontend install --frozen-lockfile
      - name: 全项目检查
        run: uv run python tools/project.py check

  build:
    name: 构建并推送镜像
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: 计算镜像前缀（镜像名必须小写）
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送 API/Worker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/research-platform-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: 构建并推送 Web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/research-platform-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: 部署到 ECS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    steps:
      - name: 准备 SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          test -n "$ECS_SSH_KEY" || { echo "缺少密钥 ECS_SSH_KEY"; exit 1; }
          test -n "$ECS_HOST" || { echo "缺少密钥 ECS_HOST"; exit 1; }
          mkdir -p ~/.ssh
          # 私钥经常从 Windows 记事本复制，带 CRLF；SSH 会报 invalid format 并以 255 退出。
          printf '%s\n' "$ECS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 私钥无法解析时立刻失败，避免以笼统的 255 出现在部署步骤里。
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || {
            echo "ECS_SSH_KEY 不是有效的 OpenSSH 私钥（需包含 BEGIN/END 两行）"
            exit 1
          }
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: 触发远端部署
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$ECS_USER" || { echo "缺少密钥 ECS_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "缺少仓库变量 DEPLOY_PATH"; exit 1; }
          # 服务器仓库只用于取部署脚本与编排；deploy/.env 与 .state 被 Git 忽略。
          # 环境变量经 stdin 传入，token 不出现在远端命令行。
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$ECS_USER@$ECS_HOST" 'bash -s' <<EOF
          set -e
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cd "$DEPLOY_PATH"
          git fetch --prune origin dev
          git reset --hard origin/dev
          bash deploy/deploy.sh --tag "$TAG"
          EOF
      - name: 冒烟检查
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          WEB_PORT: ${{ vars.WEB_PORT }}
        run: |
          port="${WEB_PORT:-80}"
          curl -fsS --max-time 10 "http://${ECS_HOST}:${port}/health/live" >/dev/null
          curl -fsS --max-time 10 "http://${ECS_HOST}:${port}/health/ready" >/dev/null
          echo "健康端点在 http://${ECS_HOST}:${port} 可用"
