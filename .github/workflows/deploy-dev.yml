name: deploy-dev

# dev 分支的自动部署：质量门禁 → 构建不可变镜像推送 ACR → SSH 到 ECS 拉取并滚动启动。
# 生产分支不经过本工作流；生产发布门槛见 docs/runbook.md。

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 同一分支串行部署，避免两次发布交叉启动容器；不取消进行中的部署，防止半途状态。
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.ACR_REGISTRY }}
  NAMESPACE: ${{ vars.ACR_NAMESPACE }}

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装固定版本工具
        run: |
          python -m pip install uv==0.12.3
          npm install --global pnpm@11.24.0
      - name: 安装锁定依赖
        run: |
          uv sync --locked
          pnpm --dir frontend install --frozen-lockfile
      - name: 全项目检查
        run: uv run python tools/project.py check

  build:
    name: 构建并推送镜像
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 校验仓库变量
        run: |
          test -n "$REGISTRY" || { echo "缺少仓库变量 ACR_REGISTRY"; exit 1; }
          test -n "$NAMESPACE" || { echo "缺少仓库变量 ACR_NAMESPACE"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: 构建并推送 API/Worker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/research-platform-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: 构建并推送 Web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/research-platform-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: 部署到 ECS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    steps:
      - name: 准备 SSH
        env:
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
        run: |
          test -n "$ECS_SSH_KEY" || { echo "缺少密钥 ECS_SSH_KEY"; exit 1; }
          test -n "$ECS_HOST" || { echo "缺少密钥 ECS_HOST"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: 触发远端部署
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          TAG: ${{ github.sha }}
        run: |
          test -n "$ECS_USER" || { echo "缺少密钥 ECS_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "缺少仓库变量 DEPLOY_PATH"; exit 1; }
          # 服务器仓库只用于取部署脚本与编排，不构建；deploy/.env 与 .state 被 Git 忽略。
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$ECS_USER@$ECS_HOST" \
            "cd '$DEPLOY_PATH' && git fetch --prune origin dev && git reset --hard origin/dev && bash deploy/deploy.sh --tag '$TAG'"
      - name: 冒烟检查
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          WEB_PORT: ${{ vars.WEB_PORT }}
        run: |
          port="${WEB_PORT:-8080}"
          curl -fsS --max-time 10 "http://${ECS_HOST}:${port}/health/live" >/dev/null
          curl -fsS --max-time 10 "http://${ECS_HOST}:${port}/health/ready" >/dev/null
          echo "健康端点在 http://${ECS_HOST}:${port} 可用"
