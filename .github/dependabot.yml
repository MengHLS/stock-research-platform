version: 2

# 依赖升级统一提到 dev：dev 是实际开发线，也是 deploy-dev 工作流的唯一触发分支。
# 不指定 target-branch 时 dependabot 默认指向仓库默认分支 main，而 main 是稳定线，
# 升级 PR 挂在 main 上既无法进入部署，也会随 dev 演进反复冲突。
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
