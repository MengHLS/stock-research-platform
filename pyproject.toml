[project]
name = "stock-research-platform"
version = "0.1.0"
description = "磐石 Quant Lab - A-share quant research workspace (Vue + FastAPI)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "pymysql[rsa]>=1.1,<2",
  "email-validator>=2.2,<3",
  # 运行时依赖：core/upstream.py 在导入期即使用，不能只放 dev 组，
  # 否则 --no-dev 构建的镜像会在启动时报 ModuleNotFoundError。
  "httpx2>=2,<3",
]

[dependency-groups]
# cryptography 由 pymysql[rsa] 传递引入；测试直接用它生成真实 CA 证书来验证 TLS
# 上下文，因此显式登记，避免上游去掉该 extra 后测试才在导入期失败。
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "cryptography>=42,<51"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/research_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
